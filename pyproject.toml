[project]
name = "repo2course"
version = "0.1.0"
description = "Turn a GitHub repo into a long-form narrated video course."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pygments>=2.18",
    "pillow>=10.4",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
edge = ["edge-tts>=6.1"]
piper = ["piper-tts>=1.2"]
default = ["google-genai>=1.0", "edge-tts>=6.1"]

[project.scripts]
repo2course = "repo2course.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repo2course"]

[tool.pytest.ini_options]
testpaths = ["tests"]
